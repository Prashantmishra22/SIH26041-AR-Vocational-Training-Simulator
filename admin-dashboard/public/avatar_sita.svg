<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#F1F5F9" />
  
  <!-- High Vis Orange Safety Jacket -->
  <path d="M 20,95 Q 50,78 80,95 L 85,100 L 15,100 Z" fill="#EA580C" />
  <!-- Neon Yellow Safety Vest Overlay -->
  <path d="M 28,95 L 36,82 L 44,100 L 28,100 Z" fill="#EAB308" />
  <path d="M 72,95 L 64,82 L 56,100 L 72,100 Z" fill="#EAB308" />
  <!-- Silver Reflective Stripes -->
  <line x1="30" y1="92" x2="42" y2="92" stroke="#E2E8F0" strokeWidth="2" />
  <line x1="70" y1="92" x2="58" y2="92" stroke="#E2E8F0" strokeWidth="2" />

  <!-- Neck & Collar -->
  <path d="M 42,75 L 58,75 L 55,84 L 45,84 Z" fill="#C28860" />
  <path d="M 45,82 L 50,88 L 55,82 Z" fill="#0284C7" />

  <!-- Face (Sita Devi - Female Industrial Worker) -->
  <ellipse cx="50" cy="56" rx="16" ry="19" fill="#D49A70" />
  
  <!-- Hair -->
  <path d="M 32,54 Q 30,70 34,76 Q 37,60 36,54 Z" fill="#1C1917" />
  <path d="M 68,54 Q 70,70 66,76 Q 63,60 64,54 Z" fill="#1C1917" />
  
  <!-- Eyes -->
  <ellipse cx="44" cy="55" rx="2.5" ry="1.8" fill="#1C1917" />
  <ellipse cx="56" cy="55" rx="2.5" ry="1.8" fill="#1C1917" />
  <circle cx="45" cy="54.5" r="0.7" fill="#FFFFFF" />
  <circle cx="57" cy="54.5" r="0.7" fill="#FFFFFF" />
  <!-- Eyebrows -->
  <path d="M 41,51 Q 44,49 47,51" stroke="#1C1917" strokeWidth="1.2" fill="none" />
  <path d="M 53,51 Q 56,49 59,51" stroke="#1C1917" strokeWidth="1.2" fill="none" />
  <!-- Small Red Bindi -->
  <circle cx="50" cy="49" r="1" fill="#DC2626" />
  <!-- Nose & Smile -->
  <path d="M 49,57 L 50,61 L 52,61" stroke="#B47B52" strokeWidth="1" fill="none" />
  <path d="M 46,65 Q 50,68 54,65" stroke="#991B1B" strokeWidth="1.5" fill="none" strokeLinecap="round" />

  <!-- Yellow Safety Helmet with Chin Strap -->
  <path d="M 32,46 Q 50,22 68,46 Z" fill="#EAB308" stroke="#CA8A04" strokeWidth="1.5" />
  <!-- Helmet Brim -->
  <path d="M 28,46 Q 50,42 72,46 L 70,48 Q 50,45 30,48 Z" fill="#FACC15" />
  <!-- Helmet Front Ridge -->
  <path d="M 47,26 L 53,26 L 52,43 L 48,43 Z" fill="#CA8A04" />
</svg>
